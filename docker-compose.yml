x-automation-environment: &automation-environment
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
  AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-true}
  AUTOMATION_RUN_IN_API: ${AUTOMATION_RUN_IN_API:-true}
  AUTOMATION_TIME_ZONE: ${AUTOMATION_TIME_ZONE:-Asia/Kolkata}
  AUTOMATION_REPORT_HOUR: ${AUTOMATION_REPORT_HOUR:-9}
  AUTOMATION_RECOVERY_MS: ${AUTOMATION_RECOVERY_MS:-3600000}
  AUTOMATION_SHEETS_DELAY_MS: ${AUTOMATION_SHEETS_DELAY_MS:-30000}
  AUTOMATION_RETENTION_DAYS: ${AUTOMATION_RETENTION_DAYS:-7}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-8}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
  TWILIO_INSIGHTS_CONTENT_SID: ${TWILIO_INSIGHTS_CONTENT_SID:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
  OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
  OCR_MAX_FILE_BYTES: ${OCR_MAX_FILE_BYTES:-1048576}

services:
  # PostgreSQL Database
  postgres:
    # SPARK's migrations create the vector extension for semantic search.
    image: pgvector/pgvector:pg16
    container_name: spark-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-spark_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spark_password}
      POSTGRES_DB: ${DB_NAME:-spark_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spark_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spark-network

  # SPARK Application (Server + Client)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-app
    ports:
      - "${APP_PORT:-8000}:4000"
    environment:
      # Node environment
      <<: *automation-environment
      AUTOMATION_RUN_IN_API: ${AUTOMATION_RUN_IN_API:-true}
      NODE_ENV: development
      PORT: 4000

      # Database
      DATABASE_URL: "postgresql://${DB_USER:-spark_user}:${DB_PASSWORD:-spark_password}@postgres:5432/${DB_NAME:-spark_db}"
      DATABASE_SSL: "false"

      # JWT & Auth
      JWT_SECRET: ${JWT_SECRET:-}
      REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET:-}
      TELEGRAM_JWT_SECRET: ${TELEGRAM_JWT_SECRET:-}

      # Token expiration
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}

      # Telegram Integration
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-osman80bot}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_OAUTH_STATE_SECRET: ${GOOGLE_OAUTH_STATE_SECRET:-}
      GOOGLE_OAUTH_STATE_EXPIRES_IN: ${GOOGLE_OAUTH_STATE_EXPIRES_IN:-10m}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}

      # Application URLs
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      GOOGLE_DRIVE_POST_CONNECT_URL: ${GOOGLE_DRIVE_POST_CONNECT_URL:-}

      # Webhooks & Security
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}

      # Extraction & Processing
      INGESTION_MAX_BODY_BYTES: ${INGESTION_MAX_BODY_BYTES:-15728640}
      ORPHAN_CLEANUP_INTERVAL_MS: ${ORPHAN_CLEANUP_INTERVAL_MS:-86400000}
      EXTRACTION_CONFIDENCE_THRESHOLD: ${EXTRACTION_CONFIDENCE_THRESHOLD:-0.8}
      EXTRACTION_MAX_TEXT_CHARS: ${EXTRACTION_MAX_TEXT_CHARS:-12000}

      # RAG Configuration
      RAG_MAX_TOP_K: ${RAG_MAX_TOP_K:-20}
      RAG_MAX_QUERY_CHARS: ${RAG_MAX_QUERY_CHARS:-512}

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spark-network
    restart: unless-stopped

  # Optional: Separate worker service for background jobs
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: spark-worker
    environment:
      <<: *automation-environment
      NODE_ENV: development
      DATABASE_URL: "postgresql://${DB_USER:-spark_user}:${DB_PASSWORD:-spark_password}@postgres:5432/${DB_NAME:-spark_db}"
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_STATE_SECRET: ${GOOGLE_OAUTH_STATE_SECRET:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - spark-network
    restart: unless-stopped
    profiles:
      - worker

volumes:
  postgres_data:
    driver: local

networks:
  spark-network:
    driver: bridge
