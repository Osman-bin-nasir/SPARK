name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build combined frontend and API image
        run: docker build -t spark-smoke .
      - name: Verify frontend and SPA routes in built image
        run: |
          docker run -d --name spark-smoke -p 4000:4000 --entrypoint node spark-smoke -e "require('./src/app').listen(4000)"
          for i in $(seq 1 30); do curl --fail http://localhost:4000/health && break || sleep 1; done
          curl --fail http://localhost:4000/login | grep '<div id="root">'
          curl --fail http://localhost:4000/transactions | grep '<div id="root">'
          docker rm -f spark-smoke
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: ci-test-jwt-secret

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build client
        run: npm run build
      - name: Lint client
        run: npm run lint
